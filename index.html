<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         PRIMARY META
         ============================================================ -->
    <title>Mohammed Aflal | Software Developer &amp; Full-Stack Developer</title>

    <meta
      name="description"
      content="Mohammed Aflal is a Software Developer and Full-Stack Developer from Sri Lanka, building modern web applications, scalable systems, and interactive digital experiences with React, TypeScript, Java, C#, and more."
    />
    <meta name="author" content="Mohammed Aflal" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050505" />

    <!-- ============================================================
         CANONICAL URL
         IMPORTANT: Replace YOUR-DOMAIN.com with the real production
         domain before deploying (e.g. https://mohamedaflal.com/).
         ============================================================ -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- ============================================================
         OPEN GRAPH (Facebook, LinkedIn, Discord, WhatsApp previews)
         IMPORTANT: Replace YOUR-DOMAIN.com before deployment.
         og:image requires a real 1200×630 image at the path shown.
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohammed Aflal | Software Developer" />
    <meta
      property="og:description"
      content="Explore the portfolio, projects, skills, education, and development journey of Mohammed Aflal — Full-Stack Developer from Sri Lanka."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:site_name" content="Mohammed Aflal Portfolio" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mohammed Aflal — Software Developer" />
    <meta property="og:locale" content="en_US" />

    <!-- ============================================================
         TWITTER / X CARD
         IMPORTANT: Replace YOUR-DOMAIN.com before deployment.
         twitter:creator omitted — no Twitter/X handle found in project.
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohammed Aflal | Software Developer" />
    <meta
      name="twitter:description"
      content="Software Developer and Full-Stack Developer building modern web applications and scalable digital experiences."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/images/og-image.jpg" />
    <meta name="twitter:image:alt" content="Mohammed Aflal — Software Developer" />

    <!-- ============================================================
         FAVICON
         Inline SVG favicon — no external file required.
         ============================================================ -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>"
    />

    <!-- ============================================================
         PERSON STRUCTURED DATA (JSON-LD)
         Uses real GitHub and LinkedIn URLs from the project.
         IMPORTANT: Replace YOUR-DOMAIN.com and the image URL before
         deploying. Only includes valid Schema.org Person properties.
         ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Mohammed Aflal",
      "jobTitle": "Software Developer",
      "description": "Full-Stack Developer from Sri Lanka specialising in modern web applications and scalable systems.",
      "url": "https://YOUR-DOMAIN.com/",
      "image": "https://YOUR-DOMAIN.com/images/aflal-portrait.webp",
      "sameAs": [
        "https://github.com/MohamedAflal-01",
        "https://linkedin.com/in/mohamedaflal01"
      ],
      "knowsAbout": [
        "React", "TypeScript", "JavaScript", "Node.js",
        "C#", "ASP.NET", "Java", "Python", "PHP",
        "SQL", "PostgreSQL", "MySQL",
        "HTML5", "CSS3", "REST API", "Git", "Figma"
      ]
    }
    </script>

    <!-- ============================================================
         FONTS
         Space Grotesk (primary) + JetBrains Mono (code/mono).
         Inter removed — Space Grotesk is the active sans-serif.
         Weights trimmed to only those actually used.
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#e5e5ea] font-sans antialiased selection:bg-white selection:text-black min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
